name: 质量与镜像验证

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pams
          POSTGRES_PASSWORD: pams_ci
          POSTGRES_DB: pams
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pams" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查项目架构边界
        run: python scripts/check_architecture.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装运行和测试依赖
        run: pip install -r backend/api/requirements.txt -r backend/scheduler/requirements.txt -r frontend/tools/requirements.txt pytest httpx ruff mypy
      - name: 标记 CI 临时数据库
        run: |
          python -c "import psycopg2; c=psycopg2.connect('postgresql://pams:pams_ci@127.0.0.1:5432/pams'); c.autocommit=True; c.cursor().execute(\"COMMENT ON DATABASE pams IS 'pams-disposable-schema-test'\"); c.close()"
          python -c "import psycopg2; c=psycopg2.connect('postgresql://pams:pams_ci@127.0.0.1:5432/pams'); c.autocommit=True; q=c.cursor(); q.execute('CREATE DATABASE pams_asset_test_ci'); q.execute(\"COMMENT ON DATABASE pams_asset_test_ci IS 'pams-isolated-asset-identity'\"); c.close()"
      - name: 测试
        env:
          PAMS_TEST_POSTGRES_DSN: postgresql://pams:pams_ci@127.0.0.1:5432/pams
          PAMS_SCHEMA_TEST_POSTGRES_DSN: postgresql://pams:pams_ci@127.0.0.1:5432/pams
          PAMS_ASSET_CI_TEST_DSN: postgresql://pams:pams_ci@127.0.0.1:5432/pams_asset_test_ci
        run: python -m pytest tests -q
      - name: Python与前端语法
        run: |
          python -m compileall -q backend/api backend/scheduler src
          for file in frontend/public/assets/js/*.js; do node --check "$file"; done
      - name: 同步模块静态检查
        run: |
          if test -f backend/scheduler/refresh_state.py; then
            ruff check --select E9,F backend/scheduler/refresh_state.py backend/scheduler/scheduler.py backend/scheduler/flex_confirmation.py backend/api/domain/operations/sync_health.py tests/scheduler/test_refresh_reliability.py tests/scheduler/test_flex_confirmation.py backend/api/domain/investments/holdings_view.py tests/investments/test_holdings_view_service.py backend/api/domain/brokers/ibkr/ibkr_reconciliation.py tests/brokers/ibkr/test_ibkr_reconciliation.py backend/api/domain/brokers/ibkr/ibkr_lineage_preflight.py tests/brokers/ibkr/test_ibkr_lineage_preflight.py backend/api/domain/brokers/ibkr/ibkr_fee_review.py tests/brokers/ibkr/test_ibkr_fee_review.py backend/api/domain/brokers/ibkr/ibkr_lineage_rehearsal.py tests/brokers/ibkr/test_ibkr_lineage_rehearsal.py tests/support/ibkr_rehearsal_support.py
            mypy --ignore-missing-imports --follow-imports=skip backend/scheduler/refresh_state.py backend/scheduler/flex_confirmation.py backend/api/domain/operations/sync_health.py backend/api/domain/investments/holdings_view.py backend/api/domain/brokers/ibkr/ibkr_reconciliation.py backend/api/domain/brokers/ibkr/ibkr_lineage_preflight.py backend/api/domain/brokers/ibkr/ibkr_fee_review.py backend/api/domain/brokers/ibkr/ibkr_lineage_rehearsal.py tests/support/ibkr_rehearsal_support.py
            ruff check --select E9,F scripts/ibkr_source_link_repair.py tests/brokers/ibkr/test_ibkr_source_link_repair.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs scripts/ibkr_source_link_repair.py
            ruff check --select E9,F backend/api/domain/brokers/ibkr/ibkr_fee_currency.py backend/api/domain/investments/investment_trade_fact.py tests/brokers/ibkr/test_ibkr_fee_currency.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/domain/brokers/ibkr/ibkr_fee_currency.py backend/api/domain/investments/investment_trade_fact.py
            ruff check --select E9,F scripts/verify_release.py tests/operations/test_verify_release.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs scripts/verify_release.py
            ruff check --select E9,F backend/api/domain/brokers/ibkr/ibkr_fee_settlement.py tests/brokers/ibkr/test_ibkr_fee_settlement.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/domain/brokers/ibkr/ibkr_fee_settlement.py
            ruff check --select E9,F backend/api/domain/brokers/ibkr/ibkr_account_audit.py backend/api/domain/brokers/ibkr/ibkr_account_audit_read.py tests/brokers/ibkr/test_ibkr_account_audit.py tests/brokers/ibkr/test_ibkr_account_audit_read.py tests/brokers/ibkr/test_ibkr_performance_service.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/domain/brokers/ibkr/ibkr_account_audit.py backend/api/domain/brokers/ibkr/ibkr_account_audit_read.py
            ruff check --select E9,F backend/api/domain/brokers/ibkr/ibkr_daily_close.py backend/api/domain/brokers/ibkr/ibkr_daily_close_read.py scripts/ibkr_daily_close.py tests/brokers/ibkr/test_ibkr_daily_close.py tests/brokers/ibkr/test_ibkr_daily_close_read.py tests/brokers/ibkr/test_ibkr_daily_close_consumers.py tests/brokers/ibkr/test_ibkr_daily_close_projection.py backend/api/domain/brokers/ibkr/ibkr_performance.py backend/api/domain/investments/portfolio_summary.py backend/api/domain/investments/portfolio_valuation_state.py backend/api/domain/investments/portfolio_state.py backend/api/domain/investments/valuation_nav.py tests/brokers/ibkr/test_ibkr_account_audit_daily_period.py tests/frontend/test_ibkr_daily_close_frontend.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/domain/brokers/ibkr/ibkr_daily_close.py backend/api/domain/brokers/ibkr/ibkr_daily_close_read.py scripts/ibkr_daily_close.py backend/api/domain/brokers/ibkr/ibkr_performance.py backend/api/domain/investments/portfolio_summary.py backend/api/domain/investments/portfolio_valuation_state.py backend/api/domain/investments/portfolio_state.py backend/api/domain/investments/valuation_nav.py
            ruff check --select E9,F backend/api/endpoints/accounts.py tests/brokers/ibkr/test_ibkr_daily_close_accounts.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/endpoints/accounts.py
            ruff check --select E9,F backend/api/domain/brokers/ibkr/ibkr_portfolio_binding.py tests/brokers/ibkr/test_ibkr_portfolio_binding.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/domain/brokers/ibkr/ibkr_portfolio_binding.py
            ruff check --select E9,F backend/api/domain/brokers/ibkr/ibkr_snapshot_alignment.py tests/brokers/ibkr/test_ibkr_snapshot_alignment.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/domain/brokers/ibkr/ibkr_snapshot_alignment.py
            ruff check --select E9,F backend/api/domain/brokers/ibkr/ibkr_funding_repair.py tests/brokers/ibkr/test_ibkr_funding_repair.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/domain/brokers/ibkr/ibkr_funding_repair.py
            ruff check --select E9,F backend/api/domain/brokers/ibkr/ibkr_daily_close_publish.py backend/api/domain/brokers/ibkr/ibkr_daily_close_sync.py tests/brokers/ibkr/test_ibkr_daily_close_sync.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/domain/brokers/ibkr/ibkr_daily_close_publish.py backend/api/domain/brokers/ibkr/ibkr_daily_close_sync.py
            ruff check --select E9,F backend/api/domain/brokers/ibkr/ibkr_cash_events.py backend/api/domain/brokers/ibkr/ibkr_cash_event_sync.py backend/api/endpoints/ibkr.py tests/brokers/ibkr/test_ibkr_cash_events.py tests/scheduler/test_ibkr_automation_scheduler.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/domain/brokers/ibkr/ibkr_cash_events.py backend/api/domain/brokers/ibkr/ibkr_cash_event_sync.py backend/api/endpoints/ibkr.py backend/api/domain/brokers/ibkr/ibkr_report_state.py
          fi
      - name: 构建API镜像并验证导入
        run: |
          docker build -f backend/api/Dockerfile -t pams-api-ci .
          docker run --rm --network host -e PGHOST=127.0.0.1 -e PGUSER=pams -e PGPASSWORD=pams_ci -e PGDATABASE=pams --entrypoint python pams-api-ci -c "import main; from domain.brokers.ibkr import ibkr_daily_close, ibkr_daily_close_read, ibkr_portfolio_binding, ibkr_snapshot_alignment, ibkr_funding_repair; assert not ibkr_daily_close_read.configured(); assert main.health().status_code == 200; assert '/api/sync/center' in main.app.openapi()['paths']; print('API and database smoke OK')"
      - name: 构建前端镜像并验证代理配置
        run: |
          docker build -t pams-web-ci frontend
          docker run --rm --add-host pams-api:127.0.0.1 pams-web-ci nginx -t
      - name: 构建调度镜像并验证时区
        run: |
          docker build -t pams-scheduler-ci backend/scheduler
          docker run --rm --entrypoint python pams-scheduler-ci -c "import scheduler; scheduler.schedule.every().day.at('16:30', 'America/New_York').do(lambda: None); print('Scheduler timezone smoke OK')"
