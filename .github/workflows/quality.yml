name: 质量与镜像验证

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pams
          POSTGRES_PASSWORD: pams_ci
          POSTGRES_DB: pams
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pams" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装运行和测试依赖
        run: pip install -r backend/api/requirements.txt -r backend/scheduler/requirements.txt -r frontend/tools/requirements.txt pytest httpx ruff mypy
      - name: 测试
        env:
          PAMS_TEST_POSTGRES_DSN: postgresql://pams:pams_ci@127.0.0.1:5432/pams
        run: python -m pytest tests -q
      - name: Python与前端语法
        run: |
          python -m compileall -q backend/api backend/scheduler src
          for file in frontend/public/assets/js/*.js; do node --check "$file"; done
      - name: 同步模块静态检查
        run: |
          if test -f backend/scheduler/refresh_state.py; then
            ruff check --select E9,F backend/scheduler/refresh_state.py backend/scheduler/scheduler.py backend/scheduler/flex_confirmation.py backend/api/services/sync_health.py tests/test_refresh_reliability.py tests/test_flex_confirmation.py backend/api/services/holdings_view.py tests/test_holdings_view_service.py backend/api/services/ibkr_reconciliation.py tests/test_ibkr_reconciliation.py backend/api/services/ibkr_lineage_preflight.py tests/test_ibkr_lineage_preflight.py backend/api/services/ibkr_fee_review.py tests/test_ibkr_fee_review.py backend/api/services/ibkr_lineage_rehearsal.py tests/test_ibkr_lineage_rehearsal.py tests/ibkr_rehearsal_support.py
            mypy --ignore-missing-imports --follow-imports=skip backend/scheduler/refresh_state.py backend/scheduler/flex_confirmation.py backend/api/services/sync_health.py backend/api/services/holdings_view.py backend/api/services/ibkr_reconciliation.py backend/api/services/ibkr_lineage_preflight.py backend/api/services/ibkr_fee_review.py backend/api/services/ibkr_lineage_rehearsal.py tests/ibkr_rehearsal_support.py
            ruff check --select E9,F scripts/ibkr_source_link_repair.py tests/test_ibkr_source_link_repair.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs scripts/ibkr_source_link_repair.py
            ruff check --select E9,F backend/api/services/ibkr_fee_currency.py backend/api/services/investment_trade_fact.py tests/test_ibkr_fee_currency.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs backend/api/services/ibkr_fee_currency.py backend/api/services/investment_trade_fact.py
            ruff check --select E9,F scripts/verify_release.py tests/test_verify_release.py
            mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs scripts/verify_release.py
          fi
      - name: 构建API镜像并验证导入
        run: |
          docker build -f backend/api/Dockerfile -t pams-api-ci .
          docker run --rm --network host -e PGHOST=127.0.0.1 -e PGUSER=pams -e PGPASSWORD=pams_ci -e PGDATABASE=pams --entrypoint python pams-api-ci -c "import main; assert main.health().status_code == 200; assert '/api/sync/center' in main.app.openapi()['paths']; print('API and database smoke OK')"
      - name: 构建前端镜像并验证代理配置
        run: |
          docker build -t pams-web-ci frontend
          docker run --rm --add-host pams-api:127.0.0.1 pams-web-ci nginx -t
      - name: 构建调度镜像并验证时区
        run: |
          docker build -t pams-scheduler-ci backend/scheduler
          docker run --rm --entrypoint python pams-scheduler-ci -c "import scheduler; scheduler.schedule.every().day.at('16:30', 'America/New_York').do(lambda: None); print('Scheduler timezone smoke OK')"
