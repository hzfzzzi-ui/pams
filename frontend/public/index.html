<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAMS · 总览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="statusbar">
    <div class="status-left">
      <span class="brand">PAMS</span>
      <div class="status-item"><span class="status-dot"></span> LIVE</div>
      <span class="status-item" id="asof">--</span>
      <span class="status-item" id="api">--</span>
    </div>
    <div class="status-right">
      <span class="pill">V1.5</span>
    </div>
  </div>

  <div class="wrap">
    <div class="nav">
      <a data-nav href="index.html">总览</a>
      <a data-nav href="strategy.html">策略</a>
      <a data-nav href="watchlist.html">观察池</a>
      <a data-nav href="holdings.html">持仓</a>
      <a data-nav href="cashflow.html">收支</a>
      <a data-nav href="backtest.html">回测</a>
    </div>

    <div id="err" class="card" style="display:none;border-color:rgba(248,81,73,.4)"></div>

    <!-- Row 1: KPIs (3) + FX Rates -->
    <div class="dashRow1" style="margin-bottom:12px">
      <div id="kpis" class="kpiGroup"></div>
      <div class="card fxCard" id="fxRates">
        <div class="fxHeader">
          <span class="fxTitle">今日汇率</span>
          <button class="fxToggle" id="fxToggleBtn" title="切换方向">⇄</button>
        </div>
        <div class="fxBody" id="fxBody">
          <div class="muted">加载中...</div>
        </div>
      </div>
    </div>

    <!-- Row 2: Alerts strip -->
    <div class="card alertStrip" id="alertStrip" style="margin-bottom:12px">
      <div class="alertStripInner" id="alerts">
        <div class="muted">加载中...</div>
      </div>
    </div>

    <!-- Row 3: Asset + Liability side by side -->
    <div class="grid2" style="margin-bottom:12px">
      <div class="card">
        <div class="sectionTitle"><h3>资产结构</h3></div>
        <div class="pies2" style="margin-top:8px">
          <div class="chartWrap chartWrapSm"><canvas id="pie"></canvas></div>
          <div class="scrollBox scrollPanel" id="byType"></div>
        </div>
      </div>
      <div class="card">
        <div class="sectionTitle"><h3>负债结构</h3></div>
        <div class="pies2" style="margin-top:8px">
          <div class="chartWrap chartWrapSm"><canvas id="liabilityPie"></canvas></div>
          <div class="scrollBox scrollPanel" id="liabilityList"></div>
        </div>
      </div>
    </div>

    <!-- Row 4: NAV Curve (with MDD) + Holdings PnL Analysis -->
    <div class="grid2" style="margin-bottom:12px">
      <div class="flexCol" style="gap:10px">
        <div class="card">
          <div class="sectionTitle">
            <h3>净资产曲线</h3>
            <span class="mddBadge" id="mddBadge">MDD: --</span>
          </div>
          <div class="chartWrap" style="margin-top:8px"><canvas id="navChart"></canvas></div>
        </div>
        <div class="card">
          <div class="sectionTitle"><h3>分类净值曲线</h3></div>
          <div class="chartWrap" style="margin-top:8px"><canvas id="catNavChart"></canvas></div>
        </div>
      </div>
      <div class="card">
        <div class="sectionTitle"><h3>持仓收益分析</h3></div>
        <div id="holdingsAnalysis" style="margin-top:8px">
          <div class="muted">加载中...</div>
        </div>
      </div>
    </div>

    <!-- Row 5: Recent Cashflow -->
    <div class="card" style="margin-bottom:12px">
      <div class="sectionTitle"><h3>近期支出</h3></div>
      <div class="grid2" style="margin-top:8px">
        <div class="chartWrap"><canvas id="cashflowMini"></canvas></div>
        <div class="scrollBox cashflowList scrollPanel" id="recentTxList" style="max-height:260px">
          <div class="muted">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
