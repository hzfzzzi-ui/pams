<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PAMS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PAMS · 风险</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260607-risk-metrics-v1" />
</head>
<body class="page-risk page-risk-metrics">
  <div class="wrap">
    <div class="nav">
      <a data-nav href="investments.html">投资</a>
      <a data-nav href="ledger.html">收支</a>
      <a data-nav href="more.html">更多</a>
    </div>

    <section class="riskCommandHero" aria-live="polite">
      <div>
        <span class="riskEyebrow">Risk Limits</span>
        <h1>风险指标</h1>
        <p>先看你自己设置的风险阈值：股票暴露、单票暴露、行业暴露、杠杆和压力损失。任务和数据核准只作为二级信息。</p>
      </div>
      <div class="riskHeroStatus" id="riskHeroStatus">
        <span>加载中</span>
        <strong>--</strong>
      </div>
    </section>

    <div id="err" class="err" style="display:none"></div>

    <main class="riskMetricPage">
      <section id="riskMetricGrid" class="riskMetricDeck" aria-label="自定义风险指标">
        <div class="skeletonLine"></div>
      </section>

      <section class="riskFocusGrid">
        <div class="riskFocusPanel">
          <div class="riskPanelHead">
            <h2>当前最需要看的项</h2>
            <span id="riskActionCount" class="statusBadge statusBadge-data">--</span>
          </div>
          <div id="riskPriorityList" class="riskPriorityList"></div>
        </div>

        <div class="riskFocusPanel">
          <div class="riskPanelHead">
            <h2>暴露来源</h2>
            <span class="statusBadge statusBadge-data">Top sources</span>
          </div>
          <div id="riskSourceList" class="riskSourceList"></div>
        </div>
      </section>

      <section class="riskFocusPanel riskNotesPanel">
        <div class="riskPanelHead">
          <h2>口径</h2>
          <span id="riskAsOf" class="statusBadge statusBadge-data">--</span>
        </div>
        <div id="riskMethodNotes" class="riskMethodNotes"></div>
      </section>
    </main>
  </div>

  <script type="module" src="assets/js/risk_metrics.js?v=20260607-risk-metrics-v1"></script>
</body>
</html>
