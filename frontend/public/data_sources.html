<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PAMS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PAMS · 数据源健康</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=20261031-modules-v1" />
  <link rel="stylesheet" href="assets/css/style.css?v=20261031-modules-v1" />
  <link rel="stylesheet" href="assets/css/design-system.css?v=20261031-modules-v1" />
  <link rel="stylesheet" href="assets/css/pages/data-sources.css?v=20261031-modules-v1" />
  <link rel="stylesheet" href="assets/css/page-shell.css?v=20261031-modules-v1" />
</head>
<body class="page-data-sources app-shell app-low-frequency" data-page-role="low-frequency">
  <div class="statusbar">
    <div class="status-left">
      <span class="brand">PAMS</span>
      <div class="status-item"><span class="status-dot"></span> LIVE</div>
      <span class="status-item">数据源健康</span>
      <span class="status-item" id="asof">--</span>
    </div>
    <div class="status-right">
      <a class="pill" href="ledger.html#accountIssueStrip">核准</a>
    </div>
  </div>

  <div class="wrap">
<main id="issuesView" hidden>
      <h1>待处理</h1>
      <div id="issuesContent" aria-live="polite">正在读取...</div>
      <a class="issueDiagnostics" href="data_sources.html">数据诊断 ›</a>
    </main>

    <div class="pageHeader">
      <div>
        <h1>同步中心</h1>
        <div class="pageSubtitle">四类同步分开看</div>
      </div>
      <div class="pageMeta">
        <details class="sourceNote sourceNoteInline">
          <summary>口径</summary>
          <div class="sourceTodo" style="margin-top:10px">只同步本地数据，不保存券商密码，不执行交易；缺口通过账户核准和投资页补齐。</div>
        </details>
        <a class="pill" href="investments.html">投资</a>
      </div>
    </div>

    <div id="err" class="card" style="display:none;border-color:rgba(248,81,73,.4)"></div>

    <div class="statusLine" id="statusLine"></div>

    <div class="sectionTitle" style="margin: var(--sp-4) 0 var(--sp-3);">
      <h3>同步矩阵</h3>
      <span class="miniBadge pending">点击看详情</span>
    </div>
    <div id="sourceList" class="sourceHealthList"></div>
    <div class="tableWrap desktopSourceTable">
      <table id="syncMatrix" class="sourceMatrix">
        <thead>
          <tr>
            <th>数据源</th>
            <th>同步类型</th>
            <th>最新时间</th>
            <th class="num">记录数</th>
            <th>状态</th>
            <th>动作</th>
          </tr>
        </thead>
        <tbody id="sourceGrid"></tbody>
      </table>
    </div>

    <div class="sectionTitle" style="margin: var(--sp-4) 0 var(--sp-3);">
      <h3>同步口径</h3>
      <span class="miniBadge pending">同步流程</span>
    </div>
    <div class="card sourceActionCard">
      <div id="todayActions" class="sourceTodo">读取中...</div>
    </div>

    <div class="sectionTitle" style="margin: var(--sp-4) 0 var(--sp-3);">
      <h3>统一质量</h3>
      <span class="miniBadge data">数据质量</span>
    </div>
    <div id="dataQuality" class="card">读取中...</div>

    <details class="sourceNote" style="margin-top:var(--sp-3)">
      <summary>链路</summary>
      <div class="pipeline">
        <div class="pipelineStep">数据源</div>
        <div class="pipelineStep">标准化</div>
        <div class="pipelineStep">核准</div>
        <div class="pipelineStep">投资/流水</div>
        <div class="pipelineStep">风险</div>
      </div>
    </details>
  </div>

  <script type="module" src="assets/js/data_sources.js?v=20261031-modules-v1"></script>
</body>
</html>
