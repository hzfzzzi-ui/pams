<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>PAMS</title>
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/app-shell.css">
</head>
<body class="pams-shell">
  <header class="pams-header">
    <span class="pams-brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15h3v6H3zm5-4h3v10H8zm5-4h3v14h-3zm5-4h3v18h-3z"/></svg><strong>PAMS</strong></span>
    <div class="pams-header-actions">
      <button type="button" class="pams-header-tools pams-reminder-btn" aria-label="提醒中心" title="提醒中心" aria-expanded="false" data-reminders-toggle>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="pams-reminder-badge" data-reminders-badge hidden></span>
      </button>
      <button type="button" class="pams-header-tools" aria-label="隐藏金额" title="隐私模式" aria-pressed="false" data-privacy-toggle>
        <svg class="icon-eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon-eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/></svg>
      </button>
      <a class="pams-header-tools" href="app.html?view=more.html#moreAdvanced" aria-label="账户工具" title="账户工具" data-shell-tools><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.2 13.4a7.4 7.4 0 0 0 0-2.8l1.4-1.1-1.5-2.6-1.7.5a7.4 7.4 0 0 0-2.4-1.4L14.7 4h-3l-.3 2a7.4 7.4 0 0 0-2.4 1.4l-1.7-.5-1.5 2.6 1.4 1.1a7.4 7.4 0 0 0 0 2.8l-1.4 1.1 1.5 2.6 1.7-.5a7.4 7.4 0 0 0 2.4 1.4l.3 2h3l.3-2a7.4 7.4 0 0 0 2.4-1.4l1.7.5 1.5-2.6z"/></svg></a>
    </div>
  </header>
  <main class="pams-viewport">
    <iframe id="page-content" title="资产页面"></iframe>
  </main>
  <nav class="pams-primary-nav" aria-label="主导航">
    <a href="app.html?view=more.html" data-page="more.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-6 5h3"/></svg>
      <span>资产</span>
    </a>
    <a href="app.html?view=investments.html" data-page="investments.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z" fill="currentColor" stroke="none"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
      <span>投资</span>
    </a>
    <a href="app.html?view=ledger.html" data-page="ledger.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7 2.5h10a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-13a3 3 0 0 1 3-3ZM8 6.25h8v1.5H8zm0 3h5v1.5H8zm1 3.75a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1z"/></svg>
      <span>收支</span>
    </a>

  </nav>
  <div id="pamsRemindersBackdrop" class="pams-reminders-backdrop" hidden>
    <section class="pams-reminders-sheet" role="dialog" aria-modal="true" aria-label="提醒中心">
      <div class="pams-reminders-head">
        <strong>提醒中心</strong>
        <button type="button" class="pams-reminders-close" data-reminders-close aria-label="关闭提醒">✕</button>
      </div>
      <div id="pamsRemindersBody" class="pams-reminders-body">
        <div class="pams-reminders-empty">正在检查提醒…</div>
      </div>
    </section>
  </div>
  <script type="module" src="assets/js/app_shell.js"></script>
</body>
</html>
