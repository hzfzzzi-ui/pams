<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PAMS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>PAMS · 资产</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/style-phone.css" />
  <link rel="stylesheet" href="assets/css/design-system-phone.css" />
  <link rel="stylesheet" href="assets/css/pages/investment-analysis.css" />
  <link rel="stylesheet" href="assets/css/more.css" />
  <link rel="stylesheet" href="assets/css/pages/monthly-overview.css" />
  <link rel="stylesheet" href="assets/css/account-sync.css" />
  <link rel="stylesheet" href="assets/css/page-shell.css" />
  <link rel="stylesheet" href="assets/css/pams-refresh.css" />
</head>
<body class="page-more app-shell app-low-frequency" data-page-role="low-frequency">
  <div class="wrap">
<main class="moreHub lowFrequencyStack" aria-label="资产">
      <nav class="assetTabs" aria-label="资产页导航"><a href="#asset-overview">总览</a><a href="#account-center">账户</a></nav>
      <section id="asset-overview">
        <section class="monthlyOverview" id="monthlyOverview" aria-label="月末资产总览">
          <p class="monthlyStatus" role="status">正在读取月末对账…</p>
          <button type="button" data-retry hidden>重新读取</button>
          <div data-report hidden>
            <header><h2>资产总览</h2><select aria-label="查看月份"></select></header>
            <section class="monthlyHero">
              <div class="between"><span data-period></span><small data-scope></small></div>
              <div class="between"><strong data-nav></strong><span data-change></span></div>
              <svg class="trend" role="img" aria-label="各月末净资产，可点选月份"></svg>
            </section>
            <p class="monthlyFocus" aria-live="polite"></p>
            <div class="metricTabs" aria-label="选择指标"></div>
            <div class="between"><div data-heading></div><div class="legend"></div></div>
            <div class="graph" aria-label="分类金额对比"></div>
            <button type="button" data-more></button>
            <details class="monthlyAudit"><summary></summary><p></p>
              <div><a href="#account-center">总资产 <b data-assets></b></a> · <a href="#asset-debts">总负债 <b data-debts></b></a></div>
            </details>
          </div>
          <div class="monthlyTip" hidden></div>
        </section>
        <div id="accountNetworthDebtsPanel" hidden></div>
        <section class="assetCard" id="asset-debts"><h2>最新负债明细</h2>
          <details id="assetFinancing" open><summary>投资融资</summary><div></div></details>
          <details id="assetCards" open><summary>信用卡欠款</summary><div></div></details>
        </section>
      </section>
      <section id="account-center" hidden>
        <div id="accountImportInbox"></div>
        <p id="accountSyncStatus" role="status">正在读取账户状态…</p>
        <button id="retryAccountSync" type="button" hidden>重新读取账户状态</button>
        <div id="accountSyncPanel" aria-label="各账户状态"></div>
        <details id="moreAdvanced" class="moreAdvanced"><summary>账户工具</summary>
        <details id="moreNavGrowthDetails" class="moreNavGrowthDetails">
          <summary>账目审计 · NAV增值解释</summary>
          <div id="moreNavGrowthExplanationPanel" class="returnInsightCard navGrowthExplanationPanel"></div>
        </details>
        <details class="moreSystem"><summary>系统信息</summary><dl><dt>应用</dt><dd>PAMS</dd><dt>访问地址</dt><dd id="moreOrigin"></dd></dl></details>
        </details>
      </section>
    </main>
  </div>
  <script type="module" src="assets/js/more.js"></script>
</body>
</html>
