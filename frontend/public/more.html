<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PAMS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>PAMS · 资产</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/style-phone.css" />
  <link rel="stylesheet" href="assets/css/design-system-phone.css" />
  <link rel="stylesheet" href="assets/css/pages/investment-analysis.css" />
  <link rel="stylesheet" href="assets/css/more.css" />
  <link rel="stylesheet" href="assets/css/account-sync.css" />
  <link rel="stylesheet" href="assets/css/page-shell.css" />
  <link rel="stylesheet" href="assets/css/pams-refresh.css" />
</head>
<body class="page-more app-shell app-low-frequency" data-page-role="low-frequency">
  <div class="wrap">
<main class="moreHub lowFrequencyStack" aria-label="资产">
      <nav class="assetTabs" aria-label="资产页导航"><a href="#asset-overview">总览</a><a href="#account-center">账户</a></nav>
      <section id="asset-overview">
        <section class="assetCard" aria-label="个人净资产">
          <h2 id="personalNetLabel">个人净资产</h2><strong id="personalNet">—</strong>
          <div class="assetFigures"><a href="#account-center">总资产<strong id="personalGross">—</strong></a><a href="#asset-debts">总负债<strong id="personalDebt">—</strong></a></div>
          <p id="personalCoverage" class="assetCoverage" role="status" hidden>部分账户资料待核验，暂无法汇总总资产和总负债。<a href="#account-center">查看账户</a></p>
          <small id="personalAsOf"></small>
        </section>
        <p id="investmentAnalysisProjectionStatus" role="status" hidden></p>
        <section class="investmentAnalysisCard returnNavPanel" aria-labelledby="investmentNavHeading">
            <div class="returnChartHeader">
              <h3 id="investmentNavHeading">净资产走势</h3>
              <div id="investmentNavWindowToggle" class="returnWindowSegment" aria-label="NAV时间范围切换"></div>
            </div>
            <div id="investmentNavStats" class="returnNavStats" aria-label="NAV变化摘要"></div>
            <div class="chartWrapSm returnNavChartWrap">
              <canvas id="investmentNavChart"></canvas>
            </div>
          </section>
        <section class="assetCard" id="asset-debts"><h2>负债明细</h2>
          <details id="assetFinancing"><summary>投资融资</summary><div></div></details>
          <details id="assetCards"><summary>信用卡欠款</summary><div></div></details>
        </section>
      </section>
      <section id="account-center" hidden>
        <p id="accountSyncStatus" role="status">正在读取账户状态…</p>
        <button id="retryAccountSync" type="button" hidden>重新读取账户状态</button>
        <div id="accountSyncPanel" aria-label="各账户状态"></div>
        <details id="moreAdvanced" class="moreAdvanced"><summary>账户工具</summary>
        <details id="moreNavGrowthDetails" class="moreNavGrowthDetails">
          <summary>账目审计 · NAV增值解释</summary>
          <div id="moreNavGrowthExplanationPanel" class="returnInsightCard navGrowthExplanationPanel"></div>
        </details>
        <details class="moreSystem"><summary>系统信息</summary><dl><dt>应用</dt><dd>PAMS</dd><dt>访问地址</dt><dd id="moreOrigin"></dd></dl></details>
        </details>
      </section>
    </main>
  </div>
  <script type="module" src="assets/js/more.js"></script>
</body>
</html>
