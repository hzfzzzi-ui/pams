<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAMS · 收支分析</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <style>
    .month-selector{display:flex;align-items:center;gap:12px;margin-bottom:16px;justify-content:center}
    .month-selector button{padding:6px 16px;background:rgba(42,37,32,.45);border:1px solid rgba(42,37,32,.7);color:var(--text);border-radius:4px;cursor:pointer;font-size:14px}
    .month-selector button:hover{background:rgba(42,37,32,.7);border-color:var(--accent)}
    .month-selector span{font-size:18px;font-weight:600;color:var(--text);min-width:100px;text-align:center}
    .amount-income{color:var(--good)}
    .amount-expense{color:var(--bad)}
    .chart-container{height:300px;margin-top:16px}
    .tab-buttons{display:flex;gap:8px;margin-bottom:12px}
    .tab-btn{padding:6px 16px;background:rgba(42,37,32,.45);border:1px solid rgba(42,37,32,.7);color:var(--muted);border-radius:4px;cursor:pointer;font-size:13px;transition:all .2s}
    .tab-btn:hover{background:rgba(42,37,32,.7);border-color:var(--accent)}
    .tab-btn.active{background:rgba(42,37,32,.7);border-color:var(--accent);color:var(--text);font-weight:600}
    .formLabel{display:block;margin-bottom:4px;color:var(--muted);font-size:13px}
    .formInput{width:100%;padding:8px;background:rgba(42,37,32,.45);border:1px solid rgba(42,37,32,.7);color:var(--text);border-radius:4px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">收支分析</div>
        <div class="muted">查看月度收支统计和交易记录</div>
      </div>
      <div class="right">
        <a class="pill" href="index.html">返回 Dashboard</a>
      </div>
    </div>

    <div class="nav" style="margin-bottom:12px">
      <a data-nav href="index.html">总览</a>
      <a data-nav href="strategy.html">策略</a>
      <a data-nav href="watchlist.html">观察池</a>
      <a data-nav href="holdings.html">持仓</a>
      <a data-nav href="cashflow.html">收支</a>
    </div>

    <div id="err" class="card" style="display:none;border-color:rgba(196,62,62,.6)"></div>

    <!-- 月份选择器 -->
    <div class="month-selector">
      <button id="prevMonth">« 上月</button>
      <span id="currentMonth">2026-02</span>
      <button id="nextMonth">下月 »</button>
    </div>

    <!-- 月度 KPI -->
    <div class="card">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
        <div class="kpi">
          <div class="kpi-label">总收入</div>
          <div class="kpi-value income" id="kpiIncome">¥0.00</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">总支出</div>
          <div class="kpi-value expense" id="kpiExpense">¥0.00</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">结余</div>
          <div class="kpi-value net" id="kpiNet">¥0.00</div>
        </div>
      </div>
    </div>

    <!-- 图表区域 - 两列布局 -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
      <!-- 开支统计 -->
      <div class="card">
        <div class="sectionTitle">
          <h3>开支统计</h3>
        </div>
        <div class="tab-buttons">
          <button class="tab-btn active" id="tabDaily">按日统计（当月）</button>
          <button class="tab-btn" id="tabMonthly">按月统计（当年）</button>
        </div>
        <div class="chart-container">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <!-- 支出分类饼图 -->
      <div class="card">
        <div class="sectionTitle"><h3>支出分类占比</h3></div>
        <div class="chart-container">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 添加交易记录 -->
    <div class="card">
      <div class="sectionTitle"><h3>添加交易</h3></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px">
        <div>
          <label class="formLabel">金额</label>
          <input type="number" id="txAmount" placeholder="输入金额" step="0.01" class="formInput">
        </div>
        <div>
          <label class="formLabel">类型</label>
          <select id="txType" class="formInput">
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
        </div>
        <div>
          <label class="formLabel">币种</label>
          <select id="txCurrency" class="formInput">
            <option value="MXN" selected>MXN (墨西哥比索)</option>
            <option value="CNY">CNY (人民币)</option>
            <option value="USD">USD (美元)</option>
          </select>
        </div>
        <div>
          <label class="formLabel">账户</label>
          <select id="txAccount" class="formInput">
            <option value="Santander" selected>桑坦德银行</option>
            <option value="腾讯理财通">腾讯理财通</option>
            <option value="建行">建行</option>
            <option value="华为账户">华为账户</option>
            <option value="公积金账户">公积金账户</option>
            <option value="币安">币安</option>
            <option value="IBKR">盈透证券</option>
            <option value="广发">广发</option>
            <option value="同花顺">同花顺</option>
            <option value="借款">借款</option>
            <option value="微信">微信</option>
          </select>
        </div>
        <div>
          <label class="formLabel">分类</label>
          <input type="text" id="txCategory" placeholder="如：餐饮、交通" class="formInput">
        </div>
        <div>
          <label class="formLabel">备注</label>
          <input type="text" id="txDescription" placeholder="说明（可选）" class="formInput">
        </div>
      </div>
      <button id="btnAddTransaction" class="btn primary" style="margin-top:12px">添加交易</button>
      <div id="addTxMsg" style="margin-top:8px;font-size:13px"></div>
    </div>

    <!-- 最近交易 -->
    <div class="card">
      <div class="sectionTitle"><h3>最近交易记录</h3></div>
      <div class="tableWrap" style="margin-top:10px">
        <table id="transactionTable">
          <thead>
            <tr>
              <th>日期</th>
              <th>分类</th>
              <th>备注</th>
              <th>币种</th>
              <th>账户</th>
              <th class="num">金额</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="muted" id="txNote" style="margin-top:12px"></div>
    </div>
  </div>

  <script type="module" src="assets/cashflow.js"></script>
</body>
</html>
