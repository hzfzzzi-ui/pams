<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#000000" />
  <title>PAMS · 导入资料</title>
  <link rel="stylesheet" href="assets/css/tokens.css?v=20261031-gray-v1" />
  <link rel="stylesheet" href="assets/css/style.css?v=20261031-gray-v1" />
  <link rel="stylesheet" href="assets/css/design-system.css?v=20261031-gray-v1" />
  <link rel="stylesheet" href="assets/css/account-import.css?v=20261031-gray-v1" />
  <link rel="stylesheet" href="assets/css/page-shell.css?v=20261031-gray-v1" />
</head>
<body class="page-account-import app-shell">
  <div class="wrap import-shell">
    <header class="import-head"><button id="flow-back" type="button" aria-label="返回上一层" title="返回">‹</button><h1>导入资料</h1></header>
    <ol class="import-steps" aria-label="导入步骤">
      <li id="step-one" aria-current="step"><span>01</span> 填写 / 识别</li>
      <li id="step-two"><span>02</span> 核对发布</li>
    </ol>
    <p id="notice" role="status" aria-live="polite">正在载入导入资料…</p>
    <p id="capability-note" class="import-meta" hidden>仅预览</p>
    <div id="conflict" role="alert" hidden>草稿已在其他会话更新。本地修改尚未覆盖服务器。<button id="reload" type="button">重新载入服务器版本</button></div>
    <div id="pending-result" class="import-warning" role="alert" hidden>操作结果待刷新确认。草稿记录与未保存编辑已保留；未完成的文件请核对结果后重新选择。<button id="refresh-result" type="button">刷新服务器结果</button></div>
    <section id="gate" aria-label="服务状态">
      <button id="retry" type="button">重新检查</button>
    </section>
    <main id="workspace" hidden>
      <section id="intake" aria-label="填写或识别">
        <label for="kind">资料类别</label><select id="kind"><option value="trade">交易</option><option value="holding">持仓快照</option><option value="cash">账单</option></select>
        <label for="account">账户</label><select id="account" required></select>
        <div class="import-modes" role="group" aria-label="录入方式">
          <button id="mode-upload" type="button" aria-pressed="true">上传文件</button>
          <button id="mode-ocr" type="button" aria-pressed="false">截图识别</button>
          <button id="mode-manual" type="button" aria-pressed="false">手动填写</button>
        </div>
        <div class="import-grid">
          <label id="completeness-label">快照范围<select id="completeness"><option value="partial">部分记录</option><option value="complete">完整快照</option></select></label>
        </div>
        <p id="complete-warning" class="import-warning" hidden>完整快照须通过成员覆盖校验，缺失不会自动清仓。</p>
        <div id="upload-area">
          <label class="import-file-label" for="files">选择文件</label>
          <input id="files" type="file" multiple accept=".csv,.tsv,.xls,.xlsx,.pdf" aria-describedby="file-formats file-limits" />
          <p id="file-formats" class="import-meta">CSV / TSV / 同花顺 XLS / XLSX · 账单 PDF</p>
          <p id="file-limits" class="import-meta"></p>
        </div>
        <div id="screenshot-area" hidden><label for="images">选择截图</label><input id="images" type="file" multiple accept="image/png,image/jpeg" /><p id="ocr-status" class="import-meta"></p></div>
        <div id="manual-records-head" class="import-section-head"><h2>暂存记录</h2><button id="add-row" type="button">＋ 新增记录</button></div>
        <p id="batch-meta" class="import-meta"></p>
        <div id="rows"></div>
        <section id="originals" aria-label="原始凭证"><h2>原始凭证</h2><div id="file-list"></div></section>
        <details id="history"><summary>最近批次</summary><div id="batch-list"></div><button id="refresh-history" type="button">刷新批次</button></details>
        <button id="new-batch" type="button">新建批次</button>
      </section>
      <section id="image-review" hidden aria-label="逐图核对">
        <h2 id="image-review-title">截图核对</h2><div id="image-original"></div><div id="image-records"></div>
      </section>
      <section id="review" aria-label="核对发布" hidden>
        <h2>配置与确认</h2><p id="review-meta" class="import-meta"></p>
        <dl id="counts" class="import-counts"></dl>
        <p id="impact" hidden></p><div id="warnings"></div><div id="issue-groups"></div>
        <label for="preview-filter">具体条目<select id="preview-filter"><option value="all">全部</option><option value="issues">异常</option><option value="excluded">已排除</option></select></label><div id="preview-rows"></div>
      </section>
    </main>
    <footer id="actions" class="import-actions" hidden>
      <button id="save-draft" type="button">保存草稿</button><button id="next" type="button" class="primary">继续 →</button>
      <button id="back" type="button" hidden>← 返回修改</button><button id="publish" type="button" class="primary" hidden disabled>确认入库</button>
      <button id="previous-image" type="button" hidden>← 上一张</button><button id="confirm-image" type="button" class="primary" hidden>确认本图并继续</button>
    </footer>
  </div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="record-form" novalidate>
      <header class="import-sheet-head"><h2 id="editor-title">编辑记录</h2><button id="close-editor" type="button" aria-label="关闭记录编辑器" title="关闭">×</button></header>
      <div class="import-sheet-body">
        <section class="import-fields"><h3>账户与日期</h3><p id="editor-account" class="import-meta"></p>
          <div id="identity-fields" class="import-grid"></div>
        </section>
        <section class="import-fields"><h3>标的与方向</h3>
          <div id="asset-lookup"><label for="asset-search">查找标的</label><input id="asset-search" type="search" placeholder="代码或名称" autocomplete="off" aria-controls="asset-results" />
            <div id="asset-results" role="group" aria-label="标的搜索结果" aria-live="polite"></div></div>
          <div id="asset-fields" class="import-grid"></div>
        </section>
        <section class="import-fields"><h3>数量与金额</h3><div id="value-fields" class="import-grid"></div></section>
        <section class="import-fields"><h3>来源与核对</h3><div id="source-fields"></div><div id="row-evidence"></div>
          <label class="import-check"><input id="row-excluded" type="checkbox" />不发布此条记录</label>
        </section>
        <p id="editor-error" role="alert"></p>
      </div>
      <footer class="import-sheet-actions"><button id="keep-edit" type="button">暂存输入并返回</button><button type="submit" class="primary">核对并保存草稿</button></footer>
    </form>
  </dialog>
  <dialog id="image-viewer" aria-label="原始截图"><button id="close-image-viewer" type="button" aria-label="关闭原图" title="关闭">×</button><img id="full-image" alt="原始截图" /></dialog>
  <script type="module" src="assets/js/account_import.js?v=20261031-import-v1"></script>
</body>
</html>
