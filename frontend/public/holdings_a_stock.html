<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAMS · A股持仓</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">A股持仓</div>
        <div class="muted">最新快照：<span id="asof">--</span></div>
      </div>
      <div class="right">
        <a class="pill" href="holdings.html">返回持仓</a>
      </div>
    </div>

    <div class="nav" style="margin-bottom:12px">
      <a data-nav href="index.html">总览</a>
      <a data-nav href="strategy.html">策略</a>
      <a data-nav href="watchlist.html">观察池</a>
      <a data-nav href="holdings.html">持仓</a>
      <a data-nav href="cashflow.html">收支</a>
    </div>

    <div id="err" class="card" style="display:none;border-color:rgba(255,107,107,.6)"></div>

    <!-- 市值趋势图 -->
    <div class="card">
      <h3>A股市值走势（近90天）</h3>
      <canvas id="trendChart" style="max-height:300px"></canvas>
    </div>

    <!-- 持仓明细 -->
    <div class="card">
      <div class="sectionTitle">
        <h3>A股持仓明细</h3>
        <div class="muted">总计：<span id="totalCount">0</span> 条</div>
      </div>
      <div class="muted" style="margin-top:-4px">包含A股股票和A股基金</div>
      <div class="tableWrap" style="margin-top:10px">
        <table class="tableWide">
          <thead>
            <tr>
              <th class="nowrap" style="width:120px">账户</th>
              <th class="nowrap" style="width:80px">小类</th>
              <th style="width:300px">名称</th>
              <th class="nowrap" style="width:60px">币种</th>
              <th class="nowrap num" style="width:120px">市值</th>
              <th class="nowrap num" style="width:120px">持仓收益</th>
              <th class="nowrap num" style="width:120px">昨日收益</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/holdings_a_stock.js"></script>
</body>
</html>
