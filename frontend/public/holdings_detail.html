<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAMS · 持仓明细</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand" id="pageTitle">持仓明细</div>
        <div class="muted">最新快照：<span id="asof">--</span></div>
      </div>
      <div class="right">
        <a class="pill" href="holdings.html">返回持仓</a>
      </div>
    </div>

    <div class="nav" style="margin-bottom:12px">
      <a data-nav href="index.html">总览</a>
      <a data-nav href="strategy.html">策略</a>
      <a data-nav href="watchlist.html">观察池</a>
      <a data-nav href="holdings.html">持仓</a>
      <a data-nav href="cashflow.html">收支</a>
    </div>

    <div id="err" class="card" style="display:none;border-color:rgba(196,62,62,.6)"></div>

    <!-- 市值趋势图 -->
    <div class="card">
      <h3 id="chartTitle">市值走势（近90天）</h3>
      <canvas id="trendChart" style="max-height:300px"></canvas>
    </div>

    <!-- 持仓明细 -->
    <div class="card">
      <div class="sectionTitle">
        <h3 id="tableTitle">持仓明细</h3>
        <div class="muted">总计：<span id="totalCount">0</span> 条</div>
      </div>
      <div class="muted" id="tableNote" style="margin-top:-4px"></div>
      <div class="tableWrap" style="margin-top:10px">
        <table class="tableWide">
          <thead id="tableHead"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/holdings_detail.js"></script>
</body>
</html>
