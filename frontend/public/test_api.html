<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>API测试</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
    pre { background: #2a2a2a; padding: 10px; border-radius: 4px; overflow-x: auto; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>PAMS API 测试</h1>

  <button onclick="testAStock()">测试 A股数据</button>
  <button onclick="testOther()">测试 其他数据</button>
  <button onclick="testAll()">测试 全部持仓</button>

  <h2>输出：</h2>
  <pre id="output"></pre>

  <script type="module">
    window.testAStock = async function() {
      try {
        const response = await fetch('/api/holdings/by-category/A股?limit=10');
        const data = await response.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        console.log('A股数据:', data);
      } catch (err) {
        document.getElementById('output').textContent = 'Error: ' + err.message;
      }
    };

    window.testOther = async function() {
      try {
        const response = await fetch('/api/holdings/by-category/其他?limit=10');
        const data = await response.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        console.log('其他数据:', data);
      } catch (err) {
        document.getElementById('output').textContent = 'Error: ' + err.message;
      }
    };

    window.testAll = async function() {
      try {
        const response = await fetch('/api/holdings/latest?limit=10');
        const data = await response.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        console.log('全部持仓:', data);
      } catch (err) {
        document.getElementById('output').textContent = 'Error: ' + err.message;
      }
    };
  </script>
</body>
</html>
