<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PAMS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PAMS · 账本</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=20261031-modules-v1" />
  <link rel="stylesheet" href="assets/css/style.css?v=20261031-modules-v1" />
  <link rel="stylesheet" href="assets/css/design-system.css?v=20261031-modules-v1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="assets/css/pages/ledger.css?v=20261101-ledger-colors" />
  <link rel="stylesheet" href="assets/css/page-shell.css?v=20261031-modules-v1" />
</head>
<body class="page-ledger app-shell">
  <div class="wrap">

    <nav class="ledgerAnchorNav" aria-label="收支模块">
      <a class="is-active" href="#cashflow-workbench" data-ledger-tab="overview">总览</a>
      <a href="#recent-flow-section" data-ledger-tab="recent">流水</a>
      <a href="#account-cashflow-section" data-ledger-tab="account">账户</a>
    </nav>
<div id="err" class="ledgerError"></div>

    <div class="ledgerPanelGroup" data-ledger-panel="overview">
      <section class="ledgerSection ledgerTop ledgerJumpCard" id="cashflow-workbench">
        <div class="sectionTitle">
          <h3 id="overviewTitle">总览</h3>
          <div class="accountPeriodToggle ledgerOverviewPeriodToggle" aria-label="总览统计周期">
            <button class="accountPeriodButton" type="button" data-overview-period="month">本月至今</button>
            <button class="accountPeriodButton active" type="button" data-overview-period="ytd">本年至今</button>
          </div>
        </div>

        <div id="ledgerMobileHero" class="ledgerMobileHero"></div>
        <div class="ledgerKpiGrid">
          <div class="ledgerKpi">
            <div class="label">收入</div>
            <div class="value up" id="kpiMonthIncome">--</div>
          </div>
          <div class="ledgerKpi">
            <div class="label">消费</div>
            <div class="value down" id="kpiMonthExpense">--</div>
          </div>
          <div class="ledgerKpi">
            <div class="label">可支配净流入</div>
            <div class="value" id="kpiDisposableNet">--</div>
          </div>
          <div class="ledgerKpi ledgerMiniMetric">
            <div class="label">投资转账</div>
            <div class="value" id="kpiInvestmentTransfer">--</div>
          </div>
          <div class="ledgerKpi ledgerMiniMetric">
            <div class="label">内部转账</div>
            <div class="value" id="kpiTransfer">--</div>
          </div>
          <div class="ledgerKpi ledgerMiniMetric">
            <div class="label">待确认流水</div>
            <div class="value" id="kpiPending">--</div>
          </div>
        </div>

        <div id="cashflowBridge" class="cashflowBridge"></div>
        <div class="cashflowBodyGrid">
          <div>
            <div class="sectionTitle" style="margin-top:var(--sp-3)">
              <h3>收支趋势</h3>
              <div class="tab-buttons" style="margin-bottom:0">
                <button id="trendMonthly" class="tab-btn active">按月</button>
                <button id="trendWeekly" class="tab-btn">按周</button>
              </div>
            </div>
            <div class="chartWrap" style="height:320px"><canvas id="cashflowTrendChart"></canvas></div>
          </div>
          <div>
            <div class="cashflowSidePanel">
              <div class="categoryInsightPanel">
                <div class="sectionTitle">
                  <h3 id="categoryInsightTitle">收入排行</h3>
                  <div class="tab-buttons categoryModeSwitch" aria-label="分类视图">
                    <button class="tab-btn active" type="button" data-overview-flow="income">收入</button>
                    <button class="tab-btn" type="button" data-overview-flow="expense">消费</button>
                  </div>
                </div>
                <div class="categoryInsightGrid">
                  <div class="categoryPieWrap">
                    <canvas id="overviewCategoryPieChart"></canvas>
                    <div id="overviewCategoryPieEmpty" class="categoryPieEmpty" hidden></div>
                  </div>
                  <div id="overviewCategoryRank"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="ledgerPanelGroup" data-ledger-panel="account" hidden>
      <section class="ledgerSection ledgerJumpCard" id="account-cashflow-section">
        <div class="sectionTitle">
          <h3>按账户统计</h3>
        </div>
        <div id="accountFlowHint" class="muted" style="margin:-4px 0 8px">账户余额优先展示；现金流变化统一按年初至今计算。</div>
        <div id="accountFlowRows" class="accountFlowList"></div>
      </section>
    </div>

    <div class="ledgerPanelGroup" data-ledger-panel="transfer" hidden>
      <section class="ledgerSection ledgerJumpCard" id="transfers">
        <div class="sectionTitle"><h3>资金流转</h3></div>
        <div id="transferSummary"></div>
      </section>
    </div>

    <div class="ledgerPanelGroup" data-ledger-panel="recent" hidden>
      <section class="ledgerSection ledgerJumpCard" id="recent-flow-section">
        <div class="sectionTitle">
          <h3>现金流水</h3>
          <div class="ledgerSectionToolbar">
            <div class="accountPeriodToggle" aria-label="流水统计周期">
              <button class="accountPeriodButton" type="button" data-recent-period="month">本月</button>
              <button class="accountPeriodButton active" type="button" data-recent-period="ytd">年初至今</button>
            </div>
            <button id="recentSearchToggle" class="ledgerIconButton" type="button" aria-label="搜索流水" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m16.5 16.5 4 4"></path>
              </svg>
            </button>
            <button id="recentSortToggle" class="ledgerIconButton" type="button" aria-label="流水排序" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10"></path>
                <path d="M4 12h16"></path>
                <path d="M4 17h7"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="recentAccountScope" class="recentAccountScope" hidden></div>
        <div id="recentFlowChips" class="ledgerFlowChips" aria-label="流水类型筛选">
          <button class="ledgerFlowChip active" type="button" data-ledger-flow-filter="">全部</button>
          <button class="ledgerFlowChip" type="button" data-ledger-flow-filter="income">收入</button>
          <button class="ledgerFlowChip" type="button" data-ledger-flow-filter="expense">消费</button>
          <button class="ledgerFlowChip" type="button" data-ledger-flow-filter="investment_transfer">投资转账</button>
          <button class="ledgerFlowChip" type="button" data-ledger-flow-filter="internal_transfer">内部转账</button>
          <button class="ledgerFlowChip" type="button" data-ledger-flow-filter="review">待确认</button>
        </div>
        <div id="recentRows" class="ledgerList"></div>
      </section>
    </div>
  </div>

  <script type="module" src="assets/js/ledger_cashflow.js?v=20261101-ledger-colors-cache"></script>
</body>
</html>
