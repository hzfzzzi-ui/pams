<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PAMS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>PAMS · 账本</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/design-system.css" />
  <link rel="stylesheet" href="assets/css/pages/ledger.css" />
  <link rel="stylesheet" href="assets/css/page-shell.css" />
</head>
<body class="page-ledger app-shell">
  <div class="wrap">

    <nav class="ledgerAnchorNav" aria-label="收支模块">
      <a class="is-active" href="#cashflow-workbench" data-ledger-tab="overview">总览</a>
      <a href="#recent-flow-section" data-ledger-tab="recent">流水</a>
      <a href="#transfers" data-ledger-tab="transfer">内部划转</a>
    </nav>
<p id="ledgerViewRefresh" class="muted" role="status" hidden></p>
<div id="err" class="ledgerError"></div>

    <div class="ledgerPanelGroup" data-ledger-panel="overview">
      <section class="ledgerSection ledgerTop ledgerJumpCard" id="cashflow-workbench">
        <div class="sectionTitle">
          <h3 id="overviewTitle">总览</h3>
          <div class="ledgerTextSwitch" role="group" aria-label="总览统计周期">
            <button type="button" data-overview-period="month" aria-pressed="false">本月至今</button>
            <button type="button" data-overview-period="ytd" aria-pressed="true">本年至今</button>
          </div>
        </div>

        <div class="ledgerOverviewCard">
          <div id="ledgerMobileHero" class="ledgerMobileHero"></div>
          <a class="ledgerOverviewTransfer" href="#transfers" data-ledger-tab="transfer">查看内部划转 <span aria-hidden="true">›</span></a>
        </div>
        <div class="cashflowBodyGrid">
          <div class="ledgerOverviewCard">
            <div class="cashflowSidePanel">
              <div class="categoryInsightPanel">
                <div class="sectionTitle">
                  <h3 id="categoryInsightTitle">收入排行</h3>
                  <div class="ledgerTextSwitch" role="group" aria-label="分类视图">
                    <button type="button" data-overview-flow="income" aria-pressed="true">收入</button>
                    <button type="button" data-overview-flow="expense" aria-pressed="false">消费</button>
                  </div>
                </div>
                <div class="categoryInsightGrid">
                  <div class="categoryPieWrap">
                    <canvas id="overviewCategoryPieChart"></canvas>
                    <div class="ledgerRingTotal" id="overviewCategoryTotal" hidden>
                      <span id="overviewCategoryTotalLabel"></span>
                      <strong id="overviewCategoryTotalValue"></strong>
                    </div>
                    <div id="overviewCategoryPieEmpty" class="categoryPieEmpty" hidden></div>
                  </div>
                  <div id="overviewCategoryRank"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="ledgerOverviewCard">
            <div class="sectionTitle">
              <h3>收支趋势</h3>
              <div class="ledgerTextSwitch" role="group" aria-label="趋势统计周期">
                <button id="trendMonthly" type="button" aria-pressed="true">按月</button>
                <button id="trendWeekly" type="button" aria-pressed="false">按周</button>
              </div>
            </div>
            <div class="chartWrap"><canvas id="cashflowTrendChart"></canvas></div>
            <p id="ledgerTrendCoverage" class="ledgerOverviewCoverage" hidden></p>
          </div>
        </div>
      </section>
    </div>

    <div class="ledgerPanelGroup" data-ledger-panel="transfer" hidden>
      <section class="ledgerSection ledgerJumpCard" id="transfers">
        <div class="sectionTitle">
          <h3>划转汇总</h3>
          <div class="ledgerTextSwitch" role="group" aria-label="划转统计周期">
            <button type="button" data-transfer-period="month" aria-pressed="false">本月</button>
            <button type="button" data-transfer-period="ytd" aria-pressed="true">本年</button>
            <button type="button" data-transfer-period="history" aria-pressed="false">历史月份</button>
          </div>
        </div>
        <label class="ledgerTransferMonth" id="transferMonthPicker" hidden>选择月份
          <input id="transferMonth" type="month" required />
        </label>
        <div id="transferSummary" class="ledgerTransferSummary" aria-live="polite"></div>
      </section>
      <section class="ledgerSection">
        <div class="sectionTitle"><h3>已确认</h3><span id="transferConfirmedCount" class="muted"></span></div>
        <div id="transferConfirmed"></div>
      </section>
      <section class="ledgerSection">
        <div class="sectionTitle"><h3>待配对</h3><span id="transferPendingCount" class="muted"></span></div>
        <p id="transferPairNotice" class="muted" role="status" hidden></p>
        <div id="transferPending"></div>
      </section>
    </div>

    <div class="ledgerPanelGroup" data-ledger-panel="recent" hidden>
      <section class="ledgerSection ledgerJumpCard" id="recent-flow-section" aria-label="流水">
        <div class="ledgerRecentBar">
          <div id="recentFlowChips" class="ledgerFlowChips" aria-label="流水类型筛选">
            <button class="ledgerFlowChip active" type="button" data-ledger-flow-filter="" aria-pressed="true">全部</button>
            <button class="ledgerFlowChip" type="button" data-ledger-flow-filter="income" aria-pressed="false">收入</button>
            <button class="ledgerFlowChip" type="button" data-ledger-flow-filter="expense" aria-pressed="false">消费</button>
            <button class="ledgerFlowChip" type="button" data-ledger-flow-filter="internal_transfer" aria-pressed="false">内部划转</button>
          </div>
          <div class="ledgerSectionToolbar">
            <div class="ledgerPeriodControl" id="recentPeriodControl">
              <button id="recentPeriodToggle" class="ledgerIconButton" type="button"
                aria-label="流水时间范围" aria-expanded="false" aria-controls="recentPeriodForm">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                  <path d="M8 3v4m8-4v4M3 10h18m-13 5h3m3 0h2"></path>
                </svg>
              </button>
              <form id="recentPeriodForm" class="ledgerPeriodPopover" hidden>
                <fieldset>
                  <legend>时间范围</legend>
                  <label>
                    <input type="radio" name="recentPeriod" value="ytd" checked />
                    <span>年初至今</span>
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"></path></svg>
                  </label>
                  <label>
                    <input type="radio" name="recentPeriod" value="month" />
                    <span>本月至今</span>
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"></path></svg>
                  </label>
                </fieldset>
                <button class="ledgerPeriodApply" type="submit">确认</button>
              </form>
            </div>
            <button id="recentSearchToggle" class="ledgerIconButton" type="button" aria-label="搜索流水" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m16.5 16.5 4 4"></path>
              </svg>
            </button>
            <button id="recentSortToggle" class="ledgerIconButton" type="button" aria-label="流水排序" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10"></path>
                <path d="M4 12h16"></path>
                <path d="M4 17h7"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="recentAccountScope" class="recentAccountScope" hidden></div>
        <div id="recentRows" class="ledgerList"></div>
      </section>
    </div>
  </div>

  <script type="module" src="assets/js/ledger_cashflow.js"></script>
</body>
</html>
