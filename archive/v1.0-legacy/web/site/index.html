<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAMS · 总览</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">PAMS 总览</div>
        <div class="muted">快照：<span id="asof">--</span> · <span id="api">--</span></div>
      </div>
      <div class="right">
        <span class="pill" style="background:rgba(67,209,158,.15);border-color:rgba(67,209,158,.4);color:#43d19e">V1.0</span>
      </div>
    </div>

    <div class="nav" style="margin-bottom:12px">
      <a data-nav href="/index.html">总览</a>
      <a data-nav href="/strategy.html">策略</a>
      <a data-nav href="/watchlist.html">观察池</a>
      <a data-nav href="/holdings.html">持仓</a>
      <a data-nav href="/cashflow.html">收支</a>
    </div>

    <div id="err" class="card" style="display:none;border-color:rgba(255,107,107,.6);margin-bottom:12px"></div>

    <!-- KPI Cards -->
    <div class="grid5" style="margin-bottom:12px" id="kpis"></div>

    <!-- Main Content: Left = Charts, Right = Alerts + Status -->
    <div class="grid2 grid2Wide">
      <!-- Left: Charts -->
      <div class="flexCol" style="gap:12px">
        <!-- Asset Pie + By-Type List -->
        <div class="card">
          <div class="sectionTitle"><h3>资产结构</h3></div>
          <div class="pies2" style="margin-top:8px">
            <div class="chartWrap"><canvas id="pie"></canvas></div>
            <div class="scrollBox" id="byType" style="padding:8px;background:rgba(0,0,0,.2);border-radius:10px"></div>
          </div>
        </div>

        <!-- Liability Pie -->
        <div class="card">
          <div class="sectionTitle"><h3>负债结构</h3></div>
          <div class="chartWrap" style="margin-top:8px"><canvas id="liabilityPie"></canvas></div>
        </div>

        <!-- NAV Curve -->
        <div class="card">
          <div class="sectionTitle"><h3>净资产曲线</h3></div>
          <div class="chartWrap" style="margin-top:8px"><canvas id="navChart"></canvas></div>
        </div>

        <!-- Cashflow Mini -->
        <div class="card">
          <div class="sectionTitle"><h3>近期收支（30天）</h3></div>
          <div class="chartWrap" style="margin-top:8px"><canvas id="cashflowMini"></canvas></div>
        </div>
      </div>

      <!-- Right: Alerts + Status -->
      <div class="flexCol" style="gap:12px">
        <div class="card">
          <div class="sectionTitle"><h3>提醒/告警</h3></div>
          <div id="alerts" style="margin-top:8px"></div>
        </div>
        <div class="card">
          <div class="sectionTitle"><h3>系统状态</h3></div>
          <div id="status" style="margin-top:8px"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
