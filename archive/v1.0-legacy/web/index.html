<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PAMS 看板（V1）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0b0f14;color:#e8eef6;margin:0;padding:18px}
    .wrap{max-width:1280px;margin:0 auto}
    .row{display:grid;grid-template-columns:1.6fr .4fr;gap:14px}
    .card{background:#111826;border:1px solid #223049;border-radius:12px;padding:14px}
    h1{font-size:18px;margin:0 0 10px}
    .muted{opacity:.8;font-size:12px;line-height:1.5}
    .kpi{font-size:13px;line-height:1.75}
    .charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
    canvas{height:360px !important}
    @media (max-width: 900px){
      .row{grid-template-columns:1fr}
      .charts{grid-template-columns:1fr}
      canvas{height:320px !important}
    }
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border-bottom:1px solid #223049;padding:6px 6px;text-align:left}
    th{opacity:.8}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid #223049;font-size:12px;opacity:.9}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card" style="margin-bottom:14px">
    <h1>PAMS 看板（V1）</h1>
    <div class="muted">数据源：SQLite（本地）。口径：收盘价更新；国信代持/华为员工持股/应收负债等均作为分项入库（规则由引擎层决定是否纳入分析）。</div>
  </div>

  <div class="row">
    <div class="card">
      <div class="charts">
        <div>
          <div class="muted" style="margin-bottom:6px">资产结构（CNY 口径）</div>
          <canvas id="assetChart"></canvas>
        </div>
        <div>
          <div class="muted" style="margin-bottom:6px">负债结构（CNY 口径）</div>
          <canvas id="liabilityChart"></canvas>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="kpi" id="kpi"></div>
      <div class="muted" style="margin-top:10px">提示：V1 只展示当日快照；V2 会加入时间序列、收益归因、现金流与复盘。</div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><b>持仓明细</b> <span class="pill" id="asof"></span></div>
      <button id="seed">初始化账户/规则</button>
    </div>
    <div style="height:10px"></div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>账户</th><th>标的</th><th>类型</th><th>数量</th><th>成本</th><th>收盘价</th><th>市值</th><th>未实现盈亏</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const fmt = (x)=> (x==null?'':Number(x).toLocaleString('zh-CN',{maximumFractionDigits:2}));

const apiBase = `http://${location.hostname}:8090`;

async function getOverview(){
  const res = await fetch(`${apiBase}/api/overview?baseCurrency=CNY`);
  return res.json();
}

function render(o){
  document.getElementById('asof').textContent = `${o.asOfDate}（${o.baseCurrency}口径）`;
  const b = o.buckets;
  const labels = ['现金','固收','权益','黄金/商品','加密','员工持股','应收','负债','其他'];
  const values = [b.cash,b.fixed_income,b.equity,b.gold_commodities,b.crypto,b.esop,b.receivable,b.liability,b.other];

  document.getElementById('kpi').innerHTML = `
    <div>总资产（折算${o.baseCurrency}）：<b>${fmt(o.totalAssets)}</b></div>
    <div>总负债（折算${o.baseCurrency}）：<b>${fmt(o.totalLiabilities)}</b></div>
    <div>净资产（折算${o.baseCurrency}）：<b>${fmt(o.netWorth)}</b></div>
    <div class="muted" style="margin-top:6px">FX：${Object.entries(o.fxUsed||{}).map(([k,v])=>`${k}=${Number(v).toFixed(4)}`).join('；') || 'n/a'}</div>
  `;

  // table
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  for (const p of o.positions){
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.accountName}</td>
      <td>${p.symbol}</td>
      <td>${p.symbolType}</td>
      <td>${fmt(p.quantity)}</td>
      <td>${p.costBasis==null?'':fmt(p.costBasis)} ${p.costCurrency||''}</td>
      <td>${p.marketPrice==null?'':fmt(p.marketPrice)} ${p.accountCurrency||''}</td>
      <td>${p.marketValue==null?'':fmt(p.marketValue)} ${p.accountCurrency||''}</td>
      <td>${p.pnlUnrealized==null?'':fmt(p.pnlUnrealized)} ${p.accountCurrency||''}</td>
    `;
    tbody.appendChild(tr);
  }

  // charts
  // Asset pie: exclude liabilities; also exclude negative/zero.
  const assetLabels = ['现金','固收','权益','黄金/商品','加密','员工持股','应收','其他'];
  const assetValues = [b.cash,b.fixed_income,b.equity,b.gold_commodities,b.crypto,b.esop,b.receivable,b.other]
    .map(v=>Math.max(0, Number(v||0)));

  const assetCtx = document.getElementById('assetChart');
  if (window.__assetChart) window.__assetChart.destroy();
  window.__assetChart = new Chart(assetCtx, {
    type: 'pie',
    data: {
      labels: assetLabels,
      datasets: [{
        data: assetValues,
        backgroundColor: ['#6aa9ff','#8FB339','#2E86AB','#f6c453','#F18F01','#9b7bff','#55d6be','#93a4bd'],
        borderWidth: 0,
      }]
    },
    options: {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{ position:'bottom', labels:{ color:'#c9d4e5', boxWidth:10 } },
        tooltip:{ callbacks:{ label:(ctx)=>`${ctx.label}: ${fmt(ctx.parsed)}` } }
      }
    }
  });

  // Liability pie: compute from positions (abs value), grouped by accountName.
  const liabMap = new Map();
  for (const p of o.positions || []){
    if (p.accountKind !== 'liability') continue;
    const k = p.accountName || p.accountId;
    const v = Math.abs(Number(p.marketValueBase ?? 0));
    liabMap.set(k, (liabMap.get(k)||0) + v);
  }
  const liabSorted = [...liabMap.entries()].sort((a,b)=>b[1]-a[1]);
  const liabLabels = liabSorted.map(([k])=>k);
  const liabValues = liabSorted.map(([,v])=>v);

  const liabCtx = document.getElementById('liabilityChart');
  if (window.__liabilityChart) window.__liabilityChart.destroy();
  window.__liabilityChart = new Chart(liabCtx, {
    type: 'pie',
    data: {
      labels: liabLabels,
      datasets: [{
        data: liabValues,
        backgroundColor: ['#ff6a6a','#ffb86b','#ffd56a','#c792ea','#82aaff','#7fdbca'],
        borderWidth: 0,
      }]
    },
    options: {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{ position:'bottom', labels:{ color:'#c9d4e5', boxWidth:10 } },
        tooltip:{ callbacks:{ label:(ctx)=>`${ctx.label}: ${fmt(ctx.parsed)}` } }
      }
    }
  });
}

document.getElementById('seed').addEventListener('click', async ()=>{
  await fetch(`${apiBase}/api/admin/seed`, { method:'POST' });
  const o = await getOverview();
  render(o);
});

getOverview().then(render).catch(err=>{
  document.getElementById('kpi').textContent = '无法加载数据：'+err;
});
</script>
</body>
</html>
