name: pams

services:
  # --- LAN DNS so iOS can resolve pams.local ---
  adguard:
    image: adguard/adguardhome:latest
    container_name: pams-adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"  # first-run setup UI
      - "8081:80/tcp"    # AdGuard web UI (after setup)
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

  # --- Reverse proxy / single stable entrypoint ---
  caddy:
    image: caddy:2
    container_name: pams-caddy
    restart: unless-stopped
    depends_on:
      - pams-web
    ports:
      - "80:80/tcp"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- Storage ---
  postgres:
    image: postgres:16-alpine
    container_name: pams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pams
      POSTGRES_USER: pams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data

  # --- PAMS application ---
  # Asset and ledger web UI
  pams-web:
    build:
      context: ./frontend
    container_name: pams-web
    restart: unless-stopped
    # Expose directly (optional). Keeps Caddy on :80.
    # Visit: http://192.168.0.143:8080
    ports:
      - "8080:80"

  # PAMS API
  pams-api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: pams-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: pams
      PGUSER: pams
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      IBKR_FLEX_TOKEN: ${IBKR_FLEX_TOKEN:-}
      IBKR_FLEX_QUERY_ID: ${IBKR_FLEX_QUERY_ID:-}
      IBKR_FLEX_POSITIONS_QUERY_ID: ${IBKR_FLEX_POSITIONS_QUERY_ID:-}
      IBKR_FLEX_OPEN_POSITIONS_QUERY_ID: ${IBKR_FLEX_OPEN_POSITIONS_QUERY_ID:-}
      PAMS_IBKR_DAILY_CLOSE_MANIFEST: ${PAMS_IBKR_DAILY_CLOSE_MANIFEST:-}
      PAMS_IBKR_DAILY_CLOSE_QUERY_ID: ${PAMS_IBKR_DAILY_CLOSE_QUERY_ID:-}
      PAMS_IBKR_CASH_EVENTS_AFTER: ${PAMS_IBKR_CASH_EVENTS_AFTER:-}
      PAMS_DATABENTO_API_KEY: ${PAMS_DATABENTO_API_KEY:-${DATABENTO_API_KEY:-}}
      PAMS_IBKR_CP_API_BASE_URL: ${PAMS_IBKR_CP_API_BASE_URL:-https://host.docker.internal:5000/v1/api}
      PAMS_IBKR_CP_VERIFY_SSL: ${PAMS_IBKR_CP_VERIFY_SSL:-false}
      PAMS_DATA_DIR: /app/data
      PAMS_IBKR_CP_TIMEOUT_SECONDS: ${PAMS_IBKR_CP_TIMEOUT_SECONDS:-2}
      PAMS_IBKR_TWS_TIMEOUT_SECONDS: ${PAMS_IBKR_TWS_TIMEOUT_SECONDS:-2}
      PAMS_IBKR_TWS_SNAPSHOT_WAIT_SECONDS: ${PAMS_IBKR_TWS_SNAPSHOT_WAIT_SECONDS:-1.5}
      PAMS_IBKR_TWS_USE_OVERNIGHT: ${PAMS_IBKR_TWS_USE_OVERNIGHT:-true}
      PAMS_IBKR_TWS_ENABLED: ${PAMS_IBKR_TWS_ENABLED:-true}
      PAMS_IBKR_TWS_HOST: ${PAMS_IBKR_TWS_HOST:-host.docker.internal}
      PAMS_IBKR_TWS_PORTS: ${PAMS_IBKR_TWS_PORTS:-4000,4001,4002,7497,7496}
      PAMS_IBKR_TWS_PERSISTENT: ${PAMS_IBKR_TWS_PERSISTENT:-true}
      PAMS_IBKR_TWS_CLIENT_ID: ${PAMS_IBKR_TWS_CLIENT_ID:-62017}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./账户台账:/host/account-ledger:ro
      - scheduler_state:/scheduler-state:ro
    ports:
      - "8090:8000"

  # 定时调度器 (汇率+股价+加密价格)
  pams-scheduler:
    build:
      context: ./backend/scheduler
    container_name: pams-scheduler
    restart: unless-stopped
    depends_on:
      - pams-api
    environment:
      PAMS_API_BASE: http://pams-api:8000/api
      TZ: UTC
      PAMS_REFRESH_STATE_PATH: /state/refresh.json
      PAMS_SCHEDULER_SKIP_STARTUP_REFRESH: ${PAMS_SCHEDULER_SKIP_STARTUP_REFRESH:-false}
      PAMS_IBKR_DAILY_CLOSE_SYNC_ENABLED: ${PAMS_IBKR_DAILY_CLOSE_SYNC_ENABLED:-false}
      PAMS_IBKR_CASH_EVENTS_SYNC_ENABLED: ${PAMS_IBKR_CASH_EVENTS_SYNC_ENABLED:-false}
    volumes:
      - scheduler_state:/state

volumes:
  adguard_work:
  adguard_conf:
  caddy_data:
  caddy_config:
  pg_data:
  scheduler_state:
